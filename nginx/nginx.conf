# ==================== CONFIGURACIÓN NGINX OPTIMIZADA ====================
# Esta configuración incluye optimizaciones de rendimiento para Laravel
# enfocadas en compresión gzip, caché y headers de seguridad.
#
# Características principales:
# - Compresión Gzip para reducir tamaño de transferencia
# - Headers de caché para assets estáticos
# - Optimización de conexiones PHP-FPM
# - Headers de seguridad
# ========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name .pawfectshop.test;
    root /var/www/html/public;

    # ==================== INDEX Y DIRECTORIOS ====================
    index index.php index.html index.htm;

    charset utf-8;

    # ==================== HEADERS DE SEGURIDAD ====================
    # Evitan expusión de información y protegen contra ataques
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ==================== COMPRESIÓN GZIP ====================
    # Activa compresión para reducir tamaño de transferencia
    # Puede reducir el tamaño en 60-80% para archivos de texto
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;  # Nivel de compresión (1-9, 6 es balance óptimo)
    gzip_buffers 16 8k;  # Buffers para compresión
    gzip_http_version 1.1;
    gzip_min_length 256;  # Solo comprimir archivos mayores a 256 bytes
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        text/x-component
        text/x-cross-domain-policy;
    gzip_disable "msie6";  # Deshabilitar para IE6 (problemas conocidos)

    # ==================== BROTLI COMPRESIÓN (OPCIONAL) ====================
    # Si tienes ngx_brotli instalado, descomenta estas líneas
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ==================== CACHE DE ASSETS ESTÁTICOS ====================
    # Los assets compilados por Vite tienen hashes en el nombre
    # Por lo que pueden tener caché de larga duración
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Cache para archivos de Vite (hot reload)
    location ~* @vite {
        proxy_pass http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ==================== LARAVEL ====================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ==================== PHP-FPM ====================
    # Optimizado para reducir overhead en comunicación con PHP
    location ~ \.php$ {
        # FastCGI params optimizados
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        # Headers y timeouts
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Keep-alive para reducir latencia
        fastcgi_keep_conn on;

        # Timeouts optimizados
        fastcgi_send_timeout 180;
        fastcgi_read_timeout 180;
        fastcgi_connect_timeout 60;

        # Buffering optimizado
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_intercept_errors on;
    }

    # ==================== HEALTH CHECK ====================
    # Endpoint para monitoreo de salud del servidor
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==================== DENY ACCESO A ARCHIVOS SENSIBLES ====================
    # Negar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Negar acceso a archivos de configuración
    location ~ /\.(?:env|git|svn|htaccess) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Negar acceso a storage y vendor
    location ~ /(storage|vendor)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==================== LOGS ====================
    # Deshabilitar access_log para mejorar rendimiento en producción
    # (comentar en desarrollo)
    access_log off;

    # Error log (solo errores y warn)
    error_log /var/log/nginx/error.log warn;

    # ==================== PERFORMANCE EXTRAS ====================
    # Sendfile optimizado (usar kernel sendfile)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keep-alive para reducir overhead de conexión
    keepalive_timeout 65;
    keepalive_requests 100;

    # Tamaño máximo de subida
    client_max_body_size 50M;
    client_body_buffer_size 1m;
}
