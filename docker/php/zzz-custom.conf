; ──────────────────────────────────────────────
; PHP-FPM Custom Configuration - Low Memory Usage
; ──────────────────────────────────────────────

[www]
; User and group (required when not running as root)
user = www-data
group = www-data

; Process manager - Reduced for low memory containers
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 100

; Performance tuning
pm.process_idle_timeout = 10s
request_terminate_timeout = 60s

; Logging
catch_workers_output = yes
clear_env = no
