<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#f1f5f9"/>

  <!-- Icono de tienda de mascotas -->
  <circle cx="200" cy="160" r="60" fill="#94a3b8" opacity="0.3"/>
  <g transform="translate(160, 120)">
    <!-- Huella de mascota -->
    <circle cx="40" cy="40" r="20" fill="#64748b"/>
    <circle cx="20" cy="10" r="12" fill="#64748b"/>
    <circle cx="60" cy="10" r="12" fill="#64748b"/>
    <circle cx="10" cy="30" r="10" fill="#64748b"/>
    <circle cx="70" cy="30" r="10" fill="#64748b"/>
  </g>

  <!-- Texto -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#475569">
    Producto
  </text>
  <text x="200" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">
    para Mascotas
  </text>
</svg>