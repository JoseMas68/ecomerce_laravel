services:
  # ──────────────────────────────────────────────
  # PHP 8.4 FPM
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ecommerce_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - ecommerce_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis

  # ──────────────────────────────────────────────
  # Nginx
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ecommerce_net
    depends_on:
      - app

  # ──────────────────────────────────────────────
  # MariaDB 11
  # ──────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: ecommerce_db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MARIADB_DATABASE: ${DB_DATABASE:-ecommerce}
      MARIADB_USER: ${DB_USERNAME:-ecommerce_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-ecommerce_pass}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ──────────────────────────────────────────────
  # Queue Worker (usa la misma imagen que app)
  # ──────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ecommerce_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - ecommerce_net
    depends_on:
      - app
      - redis
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600

  # ──────────────────────────────────────────────
  # Scheduler (cron jobs de Laravel)
  # ──────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ecommerce_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - ecommerce_net
    depends_on:
      - app
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"

# ──────────────────────────────────────────────
# Volúmenes persistentes
# ──────────────────────────────────────────────
volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

# ──────────────────────────────────────────────
# Red interna
# ──────────────────────────────────────────────
networks:
  ecommerce_net:
    driver: bridge
